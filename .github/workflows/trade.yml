name: trade
on:
  schedule:
    # Market opens 13:30 UTC (EDT) or 14:30 UTC (EST); the script exits if started outside the window.
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
